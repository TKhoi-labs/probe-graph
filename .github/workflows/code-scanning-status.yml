---
# Experiment: can a workflow READ whether code scanning is configured, using
# only the automatic token? If so, "code scanning is enabled" can become a
# reviewable, pinned assertion instead of invisible organisation state.
name: code-scanning-status

on: workflow_dispatch

permissions:
  contents: read
  security-events: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Read the default setup state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/code-scanning/default-setup" \
            --jq '"state=\(.state) languages=\(.languages|join(","))"'
