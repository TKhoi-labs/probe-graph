---
# Experiment: can a workflow enable Code Quality using only the automatic token?
# If yes, this control can live in a reviewable file like every other one.
name: enable-code-quality

on: workflow_dispatch

permissions:
  contents: read
  security-events: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable code quality
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/code-quality/setup" \
            -f state=configured
          gh api "repos/${GITHUB_REPOSITORY}/code-quality/setup" \
            --jq '"state=\(.state)"'
